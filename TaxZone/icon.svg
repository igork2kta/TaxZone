<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft drop shadow for the icon container -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="#E5E9EE" />

  <!-- App Icon Base -->
  <rect x="80" y="80" width="352" height="352" rx="72" fill="#FFFFFF" filter="url(#drop-shadow)" />

  <!-- Monogram TZ -->
  <g fill="#064B88">
    <!-- Letter T -->
    <path d="M 125 155 H 255 V 205 H 212 V 355 H 168 V 205 H 125 Z" />

    <!-- Letter Z -->
    <path d="M 257 155 H 387 V 201 L 305 310 H 387 V 355 H 257 V 309 L 339 201 H 257 Z" />
  </g>
</svg>
